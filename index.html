<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>短视频创作台 · 一站式创作工作台</title>
<meta name="description" content="面向宠物、香氛、护肤赛道的短视频一站式创作工作台" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233f9d8f'/%3E%3Cpath d='M9 11h14v11H9z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M13 8l4 3 4-3' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- 访问授权门 -->
  <div id="gate" class="gate">
    <div class="gate-bg"></div>
    <div class="gate-card">
      <div class="gate-brand">
        <div class="brand-logo" id="gateLogo"></div>
        <div>
          <div class="gate-title">短视频创作台</div>
          <div class="gate-sub">一站式创作工作台 · 授权访问</div>
        </div>
      </div>
      <div class="gate-notice">
        <span class="notice-dot"></span>
        <span>本站为邀请制。请在管理后台获取授权码后进入。</span>
      </div>
      <label class="field-label" for="gateCode">授权码</label>
      <input id="gateCode" class="input input-lg" type="text" autocomplete="off" spellcheck="false" placeholder="例如 CT-XXXX-XXXX" />
      <div id="gateError" class="gate-error" hidden></div>
      <button id="gateSubmit" class="btn btn-primary btn-block">验证并进入工作台</button>
      <div class="gate-foot">
        <span id="gateStatus">正在读取授权名单…</span>
        <button id="gateHelp" class="link-btn">没有授权码？</button>
      </div>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="brand-logo" id="sideLogo"></div>
        <div class="side-head-text">
          <div class="brand-name">短视频创作台</div>
          <div class="brand-desc">一站式创作工作台</div>
        </div>
        <button class="side-collapse" id="sideCollapse" title="收起导航" aria-label="收起导航"></button>
      </div>
      <div class="side-scroll">
        <div class="nav-group-label">创作空间</div>
        <nav class="nav" id="nav"></nav>
        <div class="nav-group-label nav-group-label-2">工作进度</div>
        <div class="stage-card">
          <div class="stage-top"><span>当前创作阶段</span><strong id="stageLabel">剪辑 · 4/6</strong></div>
          <div class="progress"><i id="stageBar" style="width:66%"></i></div>
          <div class="stage-steps" id="stageSteps"></div>
        </div>
      </div>
      <div class="side-foot">
        <div class="avatar avatar-sm" id="sideAvatar">创</div>
        <div class="side-foot-text">
          <div class="side-foot-name" id="sideUserName">创作者</div>
          <div class="side-foot-sub">云端同步中 · 数据仅本机可见</div>
        </div>
        <button class="icon-btn" id="sideMore" title="更多"></button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="crumb" id="crumb">首页概览</div>
          <div class="crumb-sub" id="crumbSub">今天也要做好创作 ✦</div>
        </div>
        <div class="topbar-right" id="topbar-right">
          <div class="clock-chip" id="topClock"></div>
          <div class="cloud-chip" id="cloudChip"><span class="dot dot-green"></span><span>本地已保存</span></div>
          <button class="icon-btn" id="btnHelp" title="使用说明"></button>
          <button class="icon-btn" id="btnNotice" title="通知"></button>
          <button class="avatar" id="topAvatar" title="账户">创</button>
        </div>
      </header>
      <main class="content" id="content">
        <div id="page-root"></div>
      </main>
    </div>
  </div>

  <div id="toast-root" class="toast-root"></div>
  <div id="modal-root" class="modal-root" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
